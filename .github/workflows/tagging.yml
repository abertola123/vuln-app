name: Snyk Monitor & Tag

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Target name as it appears in Snyk. Set by --remote-repo-url below so the
  # CLI import and snyk-tags always agree on the same target.
  SNYK_TARGET: ${{ github.repository }}

jobs:
  snyk-monitor:
    name: Monitor with Snyk and apply tags
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Set up Snyk CLI
        uses: snyk/actions/setup@master

      - name: Snyk monitor (Open Source)
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk monitor \
            --all-projects \
            --org=${{ secrets.SNYK_ORG_ID }} \
            --remote-repo-url="${SNYK_TARGET}" \
            --target-reference="${{ github.ref_name }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install snyk-tags
        run: pip install snyk-tags

      - name: Apply tags to Snyk target
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          ORG_ID: ${{ secrets.SNYK_ORG_ID }}
        run: |
          # snyk-tags applies one tag per invocation
          snyk-tags target tag \
            --target="${SNYK_TARGET}" \
            --tagKey="tag" \
            --tagValue="SOX Compliant"

          snyk-tags target tag \
            --target="${SNYK_TARGET}" \
            --tagKey="tag" \
            --tagValue="External"

      # Runs last so the snapshot and tags are always recorded in Snyk,
      # even when this step fails the build.
      - name: Snyk test (fail on high and critical)
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk test \
            --all-projects \
            --org=${{ secrets.SNYK_ORG_ID }} \
            --severity-threshold=high

